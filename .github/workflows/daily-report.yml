name: Daily IT Tech Report

on:
  schedule:
    - cron: '0 13 * * *'

  workflow_dispatch:

jobs:
  run-report:

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================
      # PYTHON
      # ================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ================================================
      # DEPENDENCIES
      # ================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ================================================
      # RUN IT TECH TRACKER
      # ================================================

      - name: Run IT Tech Tracker
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

        run: |
          python src/main.py


      # ================================================
      # SHOW GENERATED FILES
      # ================================================

      - name: Show generated files
        if: always()

        run: |
          echo "Generated files:"
          find data -maxdepth 2 -type f -print || true


      # ================================================
      # UPLOAD PHASE 1 ARTIFACTS
      # ================================================

      - name: Upload Phase 1 artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: it-tech-tracker-content-${{ github.run_number }}

          path: |
            data/infographic.png
            data/top_story.json
            data/news_report.json
            data/report.html

          if-no-files-found: warn

          retention-days: 7
